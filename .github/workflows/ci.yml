name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # Redis 는 GearShow 의 필수 인프라 (ADR-013). 테스트 ApplicationContext 부팅 시 RedissonClient
    # 가 connect 시도하므로 CI runner 에 Redis service 컨테이너를 함께 띄운다. Testcontainers
    # Redis 를 사용하는 IT (Redisson*AdapterIT 등) 는 @DynamicPropertySource 로 동적 좌표를
    # override 하므로 본 service Redis 와 무관하게 동작한다.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud 분석을 위한 전체 히스토리

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: SonarCloud 캐시 설정
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Gradle 실행 권한 부여
        run: chmod +x backend/gradlew

      - name: 빌드 및 테스트
        working-directory: backend
        run: ./gradlew build

      - name: SonarCloud 분석
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar
