name: CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: gearshow-backend
  # ADR-027 (PR2): backend 단일 컨테이너 → api + worker 두 컨테이너로 분리.
  # 같은 이미지(ECR_REPOSITORY)를 SPRING_PROFILES_ACTIVE 로만 역할 분기 실행.
  EC2_APP_DIR: /home/ec2-user/gearshow

jobs:
  # 1. 빌드 & 테스트
  build-and-test:
    name: 빌드 & 테스트
    runs-on: ubuntu-latest

    # Redis 는 GearShow 의 필수 인프라 (ADR-013). 테스트 ApplicationContext 부팅 시 RedissonClient
    # 가 connect 시도하므로 CD runner 에 Redis service 컨테이너를 함께 띄운다. ci.yml 과 동일 패턴.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle 실행 권한 부여
        run: chmod +x backend/gradlew

      - name: 빌드 및 테스트
        working-directory: backend
        run: ./gradlew build

  # 2. Docker 이미지 빌드 & ECR 푸시
  docker-push:
    name: Docker 이미지 빌드 & ECR 푸시
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 & 푸시
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # 3. EC2 배포 (docker compose 기반)
  deploy:
    name: EC2 배포
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 레지스트리 주소 조회
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 인프라 정의(compose 파일)도 버전 관리되므로, 매 배포마다 EC2에 동기화한다
      - name: docker-compose.prod.yml 을 EC2로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: ${{ env.EC2_APP_DIR }}

      # Prometheus 스크래핑 설정 + Grafana 프로비저닝 파일도 함께 배포.
      # strip_components 없이 observability/ 디렉토리 구조를 그대로 복제한다.
      - name: observability 디렉토리를 EC2로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "observability"
          target: ${{ env.EC2_APP_DIR }}

      - name: EC2 에서 api / worker 컨테이너 재기동 (ADR-027 PR2 — 2컨테이너 토폴로지)
        uses: appleboy/ssh-action@v1
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          EC2_APP_DIR: ${{ env.EC2_APP_DIR }}
          # EC2 인스턴스에 IAM Role 이 붙어있지 않으므로 ECR 로그인용 자격증명을
          # GitHub Secrets 에서 직접 주입한다. AWS CLI 가 이 환경변수들을 자동 인식.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG,AWS_REGION,EC2_APP_DIR,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -e
            cd "$EC2_APP_DIR"

            # ECR 로그인
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # compose 에서 사용하는 변수 주입
            export ECR_REGISTRY IMAGE_TAG

            # 인프라 의존 컨테이너 먼저 기동 (이미 healthy 면 no-op)
            # Kafka: Outbox Relay → Worker / Consumer
            # Redis: 3D 파이프라인 분산 락 / DelayedQueue / Tripo 세마포어
            #         (research §3.4 — 미가동 시 backend 의 3D 폴링 흐름 영구 멈춤)
            docker compose -f docker-compose.prod.yml up -d kafka redis

            # Observability 스택 기동 (idempotent — 이미 떠 있으면 no-op)
            # Prometheus 설정이 바뀌면 컨테이너를 재생성해서 새 설정 반영
            docker compose -f docker-compose.prod.yml up -d \
              prometheus grafana node-exporter

            # 새 이미지 pull 후 api/worker 둘 다 교체 (같은 이미지 — 역할은 프로파일로 분기)
            docker compose -f docker-compose.prod.yml pull api worker
            docker compose -f docker-compose.prod.yml up -d api worker

            # 헬스체크 — api 외부 + worker docker healthy 둘 다 통과해야 성공.
            # 최대 90초 대기 (Redisson 추가 로딩 + 첫 부팅 OOM 시 컨테이너 재시작 1회까지 감안).
            # api: 외부 8080 의 /api/v1/health (사용자 영향 직접 확인)
            # worker: 외부 포트 없음 — docker compose ps 의 health 상태(/dev/tcp:9091 probe) 폴링
            api_ok=0
            worker_ok=0
            for i in $(seq 1 18); do
              if [ "$api_ok" -eq 0 ] && curl -sf http://localhost:8080/api/v1/health > /dev/null 2>&1; then
                echo "✅ api 헬스체크 성공"
                api_ok=1
              fi
              if [ "$worker_ok" -eq 0 ] && docker compose -f docker-compose.prod.yml ps worker --format "{{.Status}}" 2>/dev/null | grep -q "(healthy)"; then
                echo "✅ worker 헬스체크 성공"
                worker_ok=1
              fi
              if [ "$api_ok" -eq 1 ] && [ "$worker_ok" -eq 1 ]; then
                echo "✅ 전체 헬스체크 성공 (image: $IMAGE_TAG)"

                # 배포 성공 시에만 디스크 정리 실행.
                # --filter "until=24h" 로 24시간 이내 이미지는 보존하여
                # 직전 버전으로의 즉시 롤백 경로를 보장한다.
                echo "🧹 오래된 Docker 이미지 정리 (24시간 초과)"
                docker image prune -a -f --filter "until=24h" || true
                df -h / | tail -1
                exit 0
              fi
              echo "헬스체크 대기중... ($i/18) — api=$api_ok worker=$worker_ok"
              sleep 5
            done

            echo "❌ 헬스체크 실패 (api=$api_ok worker=$worker_ok) - 최근 로그"
            docker compose -f docker-compose.prod.yml logs --tail=200 api worker
            exit 1
