<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .client { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .app { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .mq { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .cache { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .db { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .ext { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12px; fill: #475569; }
      .label { font-size: 12px; fill: #334155; }
      .qlabel { font-size: 12px; font-weight: 700; fill: #b45309; }
      .qsub { font-size: 12px; font-weight: 700; fill: #b45309; }
      .group { font-size: 13px; font-weight: 700; fill: #166534; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .qline { stroke: #d97706; stroke-width: 2; fill: none; marker-end: url(#arrow-q); }
    </style>
  </defs>

  <rect width="960" height="740" fill="#ffffff"/>

  <!-- 1행: 클라이언트 · 배포 -->
  <rect class="client" x="40" y="30" width="240" height="90" rx="10"/>
  <text class="title" x="160" y="62" text-anchor="middle">Flutter 앱</text>
  <text class="sub" x="160" y="84" text-anchor="middle">쇼케이스 · 3D 뷰어 · 채팅</text>
  <text class="sub" x="160" y="104" text-anchor="middle">카카오 · Apple 로그인</text>

  <rect class="ext" x="470" y="30" width="450" height="90" rx="10"/>
  <text class="title" x="490" y="58">배포 (CD)</text>
  <text class="sub" x="490" y="82">GitHub Actions → 빌드 · 테스트 → ECR 이미지 (git SHA 태그)</text>
  <text class="sub" x="490" y="102">→ EC2 docker compose 재기동 → api · worker 헬스체크</text>

  <!-- EC2 단일 박스 -->
  <rect x="30" y="150" width="900" height="430" rx="14" fill="#fafffb" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text class="group" x="910" y="176" text-anchor="end">AWS EC2 t3.medium · Docker Compose · 서울 리전</text>

  <path class="line" d="M160,120 L160,191"/>
  <text class="label" x="170" y="142">HTTPS · JWT · STOMP</text>
  <path class="dash" d="M695,120 L695,146"/>

  <!-- api -->
  <rect class="app" x="60" y="195" width="180" height="90" rx="10"/>
  <text class="title" x="150" y="226" text-anchor="middle">api 컨테이너</text>
  <text class="sub" x="150" y="248" text-anchor="middle">REST · WebSocket(STOMP)</text>
  <text class="sub" x="150" y="268" text-anchor="middle">Outbox Relay (1초)</text>

  <!-- Kafka -->
  <rect class="mq" x="60" y="330" width="180" height="90" rx="10"/>
  <text class="title" x="150" y="361" text-anchor="middle">Kafka 3.9</text>
  <text class="sub" x="150" y="383" text-anchor="middle">3D 생성 요청 토픽</text>
  <text class="sub" x="150" y="403" text-anchor="middle">재시도 토픽 · DLT</text>

  <path class="line" d="M150,285 L150,326"/>
  <text class="label" x="158" y="311">Outbox 이벤트</text>

  <!-- worker 컨테이너 -->
  <rect x="300" y="195" width="320" height="365" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text class="group" x="316" y="217">worker 컨테이너</text>

  <rect class="box" x="320" y="230" width="135" height="70" rx="10"/>
  <text class="title" x="387" y="259" text-anchor="middle">Tripo 폴러</text>
  <text class="sub" x="387" y="281" text-anchor="middle">폴링 · GLB 미러링</text>

  <rect class="box" x="465" y="230" width="135" height="70" rx="10"/>
  <text class="title" x="532" y="259" text-anchor="middle">복구 배치</text>
  <text class="sub" x="532" y="281" text-anchor="middle">멈춘 작업 재개 (60초)</text>

  <rect class="box" x="320" y="335" width="280" height="80" rx="10"/>
  <text class="title" x="460" y="367" text-anchor="middle">3D 생성 Consumer</text>
  <text class="sub" x="460" y="389" text-anchor="middle">입장 판단 → 상태 전이 → Tripo 작업 생성</text>

  <rect class="box" x="320" y="465" width="280" height="75" rx="10"/>
  <text class="title" x="460" y="496" text-anchor="middle">입장 큐 드레이너 (5초)</text>
  <text class="sub" x="460" y="518" text-anchor="middle">빈 슬롯만큼 꺼내 Kafka에 재발행</text>

  <!-- Kafka → Consumer -->
  <path class="line" d="M240,375 L316,375"/>
  <text class="label" x="270" y="366" text-anchor="middle">소비</text>

  <!-- Redis -->
  <rect class="cache" x="700" y="330" width="210" height="120" rx="10"/>
  <text class="title" x="805" y="360" text-anchor="middle">Redis 7</text>
  <text class="qsub" x="805" y="384" text-anchor="middle">입장 대기열 (Sorted Set)</text>
  <text class="sub" x="805" y="406" text-anchor="middle">분산 락 · 세마포어 · 폴링 큐</text>
  <text class="sub" x="805" y="428" text-anchor="middle">사용자별 일일 생성 한도</text>

  <!-- 입장 대기열 순환: Consumer → Redis → 드레이너 → Kafka -->
  <path class="qline" d="M600,375 L696,375"/>
  <text class="qlabel" x="659" y="360" text-anchor="middle">10개 초과 시</text>
  <text class="qlabel" x="659" y="395" text-anchor="middle">대기 등록</text>

  <path class="qline" d="M805,450 L805,502 L604,502"/>
  <text class="qlabel" x="705" y="522" text-anchor="middle">빈 슬롯만큼 꺼냄</text>

  <path class="qline" d="M320,502 L150,502 L150,424"/>
  <text class="qlabel" x="235" y="494" text-anchor="middle">재발행</text>

  <!-- 관측 -->
  <rect class="box" x="700" y="195" width="210" height="70" rx="10"/>
  <text class="title" x="805" y="224" text-anchor="middle">Prometheus · Grafana</text>
  <text class="sub" x="805" y="246" text-anchor="middle">지표 수집 · 대시보드</text>

  <!-- 외부 (EC2 밖) -->
  <rect class="db" x="40" y="636" width="210" height="70" rx="10"/>
  <text class="title" x="145" y="665" text-anchor="middle">MySQL 8 (RDS)</text>
  <text class="sub" x="145" y="687" text-anchor="middle">업무 데이터 · Outbox · 상태 머신</text>

  <rect class="db" x="300" y="636" width="190" height="70" rx="10"/>
  <text class="title" x="395" y="665" text-anchor="middle">AWS S3</text>
  <text class="sub" x="395" y="687" text-anchor="middle">쇼케이스 이미지 · GLB 모델</text>

  <rect class="ext" x="700" y="636" width="210" height="70" rx="10"/>
  <text class="title" x="805" y="665" text-anchor="middle">Tripo 3D API</text>
  <text class="sub" x="805" y="687" text-anchor="middle">4방향 사진 → 3D 모델 (과금)</text>

  <path class="line" d="M60,240 L45,240 L45,632"/>
  <path class="line" d="M360,560 L360,612 L190,612 L190,632"/>
  <text class="label" x="275" y="604" text-anchor="middle">조건부 UPDATE</text>
  <path class="line" d="M450,560 L450,632"/>
  <text class="label" x="458" y="612">GLB 저장</text>
  <path class="line" d="M570,560 L570,612 L805,612 L805,632"/>
  <text class="label" x="688" y="604" text-anchor="middle">작업 생성 · 폴링</text>
</svg>
