# 축구화 사일로 사전 — 시리즈 단위 (ADR-022).
#
# 정책 변경 (2026-05-08): 라인 단위(`Phantom GX`, `Tiempo Legend`) 에서
# 시리즈 단위(`Phantom`, `Tiempo`) 로 통일. 사용자 결정 — 검색 정밀도 손실 감수,
# 운영 단순성 + 매칭률 100% 우선. 자세한 근거는 ADR-022 §Decision 참조.
#
# 누락된 시리즈는 운영자 검수 단계에서 발견 → 본 파일 보강 → 재크롤링.

