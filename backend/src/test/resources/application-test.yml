spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    enabled: false

  datasource:
    url: jdbc:tc:mysql:8.0:///gearshow?TC_REUSABLE=true
    username: gearshow
    password: gearshow
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

# JWT 테스트용 설정
jwt:
  secret: test-secret-key-for-unit-testing-purposes-only-minimum-256-bits-required
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

# OAuth 테스트용 설정 (실제 호출하지 않음, Mock 사용)
oauth:
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
    redirect-uri: http://localhost:8080/api/v1/auth/login/kakao
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  apple:
    client-id: test-apple-client-id
    team-id: test-apple-team-id
    key-id: test-apple-key-id
    private-key-path:
    token-uri: https://appleid.apple.com/auth/token
    redirect-uri: http://localhost:8080/api/v1/auth/login/apple

# AWS S3 테스트용 설정
cloud:
  aws:
    s3:
      region: ap-northeast-2
      access-key: test-access-key
      secret-key: test-secret-key
      bucket: test-bucket
      cdn-url: https://test-cdn.gearshow.com
      endpoint: http://localhost:4566

# WebSocket 테스트용 설정
gearshow:
  websocket:
    allowed-origins: http://localhost:*

  # Redis (ADR-013 — 필수 인프라). default 좌표는 localhost — CI 는 services.redis 가
  # localhost:6379 에 노출, 로컬은 docker-compose.yml 의 redis 컨테이너. Testcontainers Redis
  # 를 띄우는 IT (Redisson*AdapterIT 등) 는 @DynamicPropertySource 로 동적 좌표를 override.
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

# 통합 테스트에서 redis 활성화 시 WorkflowPollingScheduler 가 ApplicationReadyEvent 로
# 무한 take() 루프를 시작해 Spring Context 종료 시점에 hang 되는 문제 회피.
# 테스트는 Bean 자체 검증이 아니라 Adapter 단위 검증이므로 스케줄러는 항상 OFF.
app:
  workflow-polling:
    scheduler-enabled: false
