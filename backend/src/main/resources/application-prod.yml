# ===========================================
# 운영 환경 설정 (EC2 배포)
# ===========================================

# ===========================================
# 관리 포트 분리 (Actuator 외부 노출 차단)
# ===========================================
# actuator 엔드포인트를 메인 API 포트(8080) 가 아닌 별도 포트(9091) 에서 서비스한다.
# 9091 은 docker compose 의 ports: 매핑에 포함되지 않고 EC2 보안 그룹에도 등록되지 않으므로,
# 인터넷/EC2 호스트에서는 접근 불가. 같은 compose 네트워크의 Prometheus 컨테이너만
# backend:9091 로 스크래핑할 수 있다.
#
# - address: 0.0.0.0 → 컨테이너 내부 모든 인터페이스에 바인딩 (Prometheus 컨테이너가 도달 가능해야 함)
# - port: 9091       → 메인 포트와 분리
# ===========================================
management:
  server:
    port: 9091
    address: 0.0.0.0

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  # Kafka Consumer concurrency(기본 3) + 정리 스케줄러 + 일반 요청을 모두 수용
  # HikariCP 기본값(10)은 동시 메시지 처리 시 부족할 수 있어 명시적으로 상향
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

# ===========================================
# 멱등성 이력 정리 설정 (CleanupProcessedMessageService)
# 값은 @Validated + @Min으로 Bean 생성 시점에 검증된다
# ===========================================
app:
  idempotency:
    retention-days: 7
    cleanup-batch-size: 1000
    cleanup-batch-sleep-ms: 50
    # 매일 새벽 3시 정리
    cleanup-cron: "0 0 3 * * *"
    cleanup-zone: Asia/Seoul

  # Transactional Outbox Relay 설정
  outbox:
    relay-interval-ms: 1000        # 1초 주기로 미발행 메시지 Kafka 발행
    batch-size: 100                # 한 주기당 최대 100건
    publish-timeout-ms: 5000       # Kafka 발행 동기 대기 타임아웃
    cleanup-cron: "0 0 4 * * *"    # 새벽 4시 발행 완료 레코드 정리
    cleanup-zone: Asia/Seoul
    retention-days: 7              # 발행 완료 후 7일 보존
    cleanup-batch-size: 1000
    cleanup-batch-sleep-ms: 50

  # 워크플로우 폴링 인프라 (DelayedQueue 기반 경로 전용 — P1-E)
  workflow-polling:
    delay-seconds: 30               # 재대기 지연
    scheduler-enabled: true

  # Tripo HTTP API 호출 설정
  tripo-api:
    semaphore-acquire-timeout-ms: 2000

  # Reconcile 배치 (설계 §8.4 — P1-G)
  # ⚠️ 활성화는 gearshow.redis.enabled=true 와 AND 조건이다 (코드 레벨 강제 — ReconcileScheduler /
  # ReconcileStuckWorkflowsService 의 @ConditionalOnExpression 참조). 단일 인스턴스 prod
  # (Redis 미사용) 에선 enabled=true 라도 자동으로 비활성화되어 부팅 정합성을 유지한다.
  # 다중 인스턴스 도입 시 REDIS_ENABLED=true 만 설정하면 자동으로 함께 활성화된다.
  reconcile:
    enabled: true
    fixed-delay-ms: 60000
    batch-size: 50
    preparing-stuck-seconds: 60
    generating-tripo-stuck-minutes: 8
    generating-s3-stuck-minutes: 5
    requested-stuck-seconds: 30

# ===========================================
# Resilience4j Circuit Breaker (Tripo API 보호)
# ===========================================
# - slidingWindowSize(10) 호출 중 failureRateThreshold(50%) 실패 시 OPEN
# - OPEN 후 waitDurationInOpenState(30s) 동안 모든 호출 차단 (fast-fail)
# - 이후 HALF_OPEN 상태로 전환, permittedNumberOfCallsInHalfOpenState(3) 건 시도
# - OPEN 상태에서 상위 레이어가 CallNotPermittedException 을 잡아 모델을 UNAVAILABLE 로 전환
resilience4j:
  circuitbreaker:
    instances:
      tripo:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

# ===========================================
# Kafka 운영 메모
# acks=all이 실제 내구성을 보장하려면 브로커/토픽의 min.insync.replicas >= 2 필수
# MSK 도입 시 토픽 생성 옵션에서 설정: --config min.insync.replicas=2
# ===========================================

# ===========================================
# WebSocket 허용 Origin (프로덕션)
# ===========================================
# 현 시점 WebSocket 클라이언트는 Flutter 모바일 네이티브뿐이며 Origin 헤더를 보내지 않아
# 이 allowlist 검사 대상이 아니다. 기본값 localhost 만으로 정상 동작한다.
# 웹 브라우저 클라이언트(관리 콘솔·Flutter Web 등) 추가 시점에 EC2 env
# `WEBSOCKET_ALLOWED_ORIGINS` 로 실제 도메인을 쉼표 구분해 override 한다.
# Spring 이 쉼표 문자열을 String[] 로 자동 바인딩.
# ===========================================
gearshow:
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*}
